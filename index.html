<!DOCTYPE html>
<html>
<head>
  <title>Share My Location</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    button { padding: 14px 28px; font-size: 18px; margin-top: 20px; }
    #status { margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>Delivery Tracking</h2>
  <p>Tap below to share your location with dispatch.</p>
  <button onclick="shareLocation()">Share My Location</button>
  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaGqWidMpp5yrfuEgHQCNtRC-KIBf1VcI",
      authDomain: "loc-access-853e3.firebaseapp.com",
      projectId: "loc-access-853e3",
      storageBucket: "loc-access-853e3.firebasestorage.app",
      messagingSenderId: "254101115524",
      appId: "1:254101115524:web:ac71a9421462ad39c928d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Give this courier a stable ID so their location updates the same record
    let courierId = localStorage.getItem("courierId");
    if (!courierId) {
      courierId = "courier_" + Math.random().toString(36).slice(2, 9);
      localStorage.setItem("courierId", courierId);
    }

    window.shareLocation = function () {
      if (!navigator.geolocation) {
        document.getElementById("status").innerText = "Geolocation not supported on this device.";
        return;
      }

      document.getElementById("status").innerText = "Requesting permission...";

      navigator.geolocation.watchPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          await setDoc(doc(db, "locations", courierId), {
            lat: lat,
            lon: lon,
            accuracy: accuracy,
            updatedAt: serverTimestamp()
          });

          document.getElementById("status").innerText =
            `Sharing live location (accuracy ${Math.round(accuracy)}m). Keep this tab open.`;
        },
        (error) => {
          document.getElementById("status").innerText = "Error: " + error.message;
        },
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    };
  </script>

</body>
</html>
