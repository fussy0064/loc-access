<!DOCTYPE html>
<html>
<head>
  <title>My Exact Location</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; padding: 20px; }
    #map { height: 400px; margin-top: 20px; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

  <h2>Get My Exact Location</h2>
  <button onclick="getLocation()">Allow Location</button>
  <p id="output">Click the button. Your browser will ask permission.</p>
  <div id="map"></div>

  <script>
    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById("output").innerText = "Geolocation not supported.";
        return;
      }
      navigator.geolocation.getCurrentPosition(showPosition, showError, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      document.getElementById("output").innerText =
        `Lat: ${lat}, Lon: ${lon} (accuracy: ${accuracy} meters)`;

      const map = L.map('map').setView([lat, lon], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker([lat, lon]).addTo(map)
        .bindPopup("You are here").openPopup();

      fetch("/api/location", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat: lat, lon: lon, accuracy: accuracy })
      })
      .then(res => res.json())
      .then(data => console.log("Server response:", data));
    }

    function showError(error) {
      document.getElementById("output").innerText = "Error: " + error.message;
    }
  </script>

</body>
</html>
